name: Sync state from job-bot

on:
  schedule:
    # Safety net — runs every 30 minutes even without a dispatch trigger.
    - cron: "*/30 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [bot-run]

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-state
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dashboard repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Pull state/ from job-bot
        env:
          BOT_REPO_PAT: ${{ secrets.BOT_REPO_PAT }}
          BOT_REPO_OWNER: sohankusumaukjobs
          BOT_REPO_NAME: job-bot
          BOT_REPO_BRANCH: main
        run: node scripts/sync-state.mjs

      - name: Commit + push changes (if any)
        run: |
          git config user.email "dashboard-sync@local"
          git config user.name "Dashboard Sync"
          # public/state/ is the live tree Vercel serves; clean up the old
          # top-level state/ tree if it's still around from earlier syncs.
          if [ -d public/state ]; then
            git add public/state/
          else
            echo "No public/state/ directory yet (bot hasn't run --bootstrap?). Skipping."
            exit 0
          fi
          # Remove legacy top-level state/ contents if present (cleanup of old layout).
          if [ -d state ]; then
            git rm -r --cached --ignore-unmatch state/ 2>/dev/null || true
            rm -rf state/runs state/seen_jobs.json state/.gitkeep 2>/dev/null || true
            git add -A state/ 2>/dev/null || true
          fi
          if git diff --cached --quiet; then
            echo "No changes — nothing to commit."
          else
            git commit -m "sync: pull state from job-bot ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi

      # ── Failure alerting ──────────────────────────────────────────────
      # The cron retries every 30 min, so a broken credential fails forever
      # in silence unless someone watches the Actions tab. On the FIRST
      # failure we open a pinned issue (GitHub emails the owner) and — if
      # TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID secrets are configured — send
      # a Telegram alert. While the issue stays open we don't re-alert
      # (no spam); when a later run succeeds, the issue is auto-closed so
      # the next distinct outage alerts again.
      - name: Alert on failure (issue + optional Telegram)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="🚨 Dashboard sync is failing"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "Alert issue #$EXISTING already open — not re-alerting."
            exit 0
          fi
          gh issue create --title "$TITLE" --body "The state-sync workflow is failing, so the public dashboard is no longer receiving new runs.

          Most common cause: the **BOT_REPO_PAT** secret expired (the log shows \`401 Bad credentials\`).

          **Fix:**
          1. Create a new fine-grained PAT — repo access: only the bot repo, permission: *Contents: Read-only*.
          2. Update the \`BOT_REPO_PAT\` secret in this repo's *Settings → Secrets and variables → Actions*.
          3. Re-run the sync workflow.

          Failing run: $RUN_URL

          _This issue was opened automatically; it will auto-close when a sync succeeds._"
          if [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              -d chat_id="${TG_CHAT}" \
              --data-urlencode text="🚨 Dashboard sync is FAILING — new runs are not reaching the dashboard. Likely the BOT_REPO_PAT secret expired. Details: ${RUN_URL}" \
              >/dev/null && echo "Telegram alert sent." || echo "Telegram alert failed (non-fatal)."
          else
            echo "Telegram secrets not configured — skipped Telegram alert."
          fi

      - name: Close alert issue on recovery
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="🚨 Dashboard sync is failing"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --comment "Sync succeeded again — closing automatically. ✅"
            echo "Closed alert issue #$EXISTING."
          fi
